[project]
name = "axiprop_utils"
version = "0.13.3"
description = "Helper functions for the Axiprop code"
authors = [{ name = "Anton Golovanov" }]
requires-python = ">=3.12"
dependencies = [
    "axiprop",
    "h5py",
    "lasy",
    "matplotlib",
    "mpl_utils @ git+https://github.com/agolovanov/mpl_utils.git",
    "numpy",
    "pic_utils @ git+https://github.com/agolovanov/pic_utils.git",
    "pint",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["build", "pytest", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["axiprop_utils*"]

[tool.pytest.ini_options]
pythonpath = ["."]
